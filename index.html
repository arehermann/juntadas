<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0E1B">
<meta name="description" content="Coordiná juntadas con tus amigas: disponibilidad, fecha y gastos.">
<title>Juntadas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Juntadas">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="alternate icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A0E1B'/%3E%3Crect x='6' y='8' width='20' height='18' rx='3' fill='none' stroke='%237FA9D6' stroke-width='2.5'/%3E%3Crect x='10' y='14' width='5' height='4' fill='%23E3B76B'/%3E%3Crect x='17' y='14' width='5' height='4' fill='%23B3A1DB'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
:root{
  --bg0:#0A0E1B;--card0:#0E1324;--sheet0:#0B1022;--field:#0E1430;
  --ink:#E9EEFF;--muted:#8E97B8;--line:rgba(140,155,200,.22);
  --cy:#7FA9D6;--pk:#B3A1DB;--gr:#E3B76B;--gr-ink:#241A06;
  --heat-lo:#161D36;--heat-mid:#4A6A99;--heat-hi:#B3A1DB;--empty:rgba(255,255,255,.07);
  --display:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;--num:'Chakra Petch','Outfit',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg0);color:var(--ink);height:100%}
body{font-family:var(--display);font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.app{position:relative;min-height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
  background:linear-gradient(rgba(120,135,190,.12) 1px,transparent 1px) 0 0/34px 34px,linear-gradient(90deg,rgba(120,135,190,.12) 1px,transparent 1px) 0 0/34px 34px,var(--bg0)}
@media (min-width:560px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.top{padding:calc(18px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;align-items:center;gap:10px;min-height:58px}
.top .ttl{flex:1;min-width:0}
.top h2{margin:0;font-size:1.45rem;line-height:1.1;font-weight:700;letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.top small{display:block;color:var(--muted);font-size:.82rem;margin-top:3px}
.brand{font-family:var(--num);font-weight:700;font-size:.85rem;letter-spacing:.06em;color:var(--pk)}
.iconbtn{width:40px;height:40px;flex:none;display:grid;place-items:center;border:1.5px solid var(--cy);color:var(--cy);background:transparent;border-radius:50%}
.iconbtn svg{width:20px;height:20px}
.body{flex:1;padding:6px 16px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;display:flex;gap:4px;padding:8px 14px calc(12px + env(safe-area-inset-bottom,0px));z-index:5;background:rgba(8,11,23,.94);border-top:1px solid var(--line)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border:0;background:transparent;font-size:.74rem;font-weight:600;color:var(--muted);border-radius:16px}
.nav svg{width:21px;height:21px}
.nav button[aria-current="page"]{color:var(--gr);background:rgba(227,183,107,.12)}
.card{padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--card0);border:1.5px solid var(--line);border-radius:22px;min-width:0}
.card.hi{border-color:var(--cy)}
.card.vote{border-color:var(--pk)}
.card.ok{border-color:var(--gr)}
button.card{text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.lbl{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--cy);font-weight:700;font-family:var(--num)}
.lbl.st-vote{color:var(--pk)}.lbl.st-ok{color:var(--gr)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
h3{margin:0;font-size:1.04rem;font-weight:600;overflow-wrap:anywhere}
p{margin:0;line-height:1.5}
.big{font-family:var(--display);font-size:1.45rem;font-weight:700;line-height:1.1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;font-weight:700;border:0;border-radius:999px;background:var(--cy);color:#0A1322;text-decoration:none;text-align:center}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg,.chip svg,.opt svg{width:18px;height:18px;flex:none}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:1.5px solid var(--cy);color:var(--cy)}
.btn.alt{background:var(--gr);color:var(--gr-ink)}
.btn.danger{background:transparent;border:1.5px solid var(--line);color:var(--muted)}
.btns{display:flex;gap:8px}.btns .btn{flex:1}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;flex:none;color:#141022;border:1.5px solid var(--bg0)}
.avs{display:flex;flex-wrap:wrap;row-gap:4px}.avs .av{margin-left:-8px}.avs .av:first-child{margin-left:0}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;min-width:0}
.li+.li{border-top:1px dashed var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;font-size:.84rem;font-weight:700;border:1.5px solid var(--cy);color:var(--cy);background:transparent;border-radius:999px}
.chip[aria-pressed="true"]{background:var(--pk);border-color:var(--pk);color:#1A1430}
.seg{display:flex;padding:4px;gap:4px;background:var(--card0);border:1px solid var(--line);border-radius:16px}
.seg button{flex:1;padding:9px 6px;border:0;background:transparent;font-weight:700;font-size:.86rem;display:flex;gap:6px;align-items:center;justify-content:center;border-radius:12px;color:var(--muted)}
.seg svg{width:16px;height:16px}
.seg button[aria-pressed="true"]{background:rgba(227,183,107,.12);color:var(--gr);outline:1.5px solid var(--gr);outline-offset:-1.5px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--field);border-radius:12px;min-width:0;font-size:16px}
.field input:focus,.field select:focus{outline:none;border-color:var(--cy)}
.field select option{background:var(--sheet0)}
.fields{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.x{border:0;background:transparent;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:var(--pk);flex:none}
.x svg{width:16px;height:16px}
.linkbtn{border:0;background:transparent;color:var(--cy);font-weight:600;padding:6px 0;text-decoration:underline;text-underline-offset:3px}

/* grilla */
.gridwrap{overflow-x:auto;margin:0 -4px;padding:0 4px 2px}
.grid{display:grid;grid-template-columns:34px repeat(var(--cols),minmax(34px,1fr));gap:3px;user-select:none;-webkit-user-select:none}
.grid.mine{touch-action:none}
.gh{text-align:center;font-size:.7rem;line-height:1.1;padding-bottom:4px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.gh b{display:block;font-size:.95rem;color:var(--ink);font-family:var(--num);font-weight:700;letter-spacing:0}
.gt{font-size:.68rem;color:var(--muted);text-align:right;padding-right:4px;line-height:26px;font-family:var(--num)}
.c{height:26px;border:0;padding:0;position:relative;background:var(--heat-lo);border-radius:4px}
.grid.mine .c{background:var(--empty);cursor:pointer}
.grid.mine .c.on{background:var(--gr)}
.grid.heat .c.sel{outline:2.5px solid var(--gr);outline-offset:1px;z-index:1}
.grid.heat .c.full::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:#0E1324;left:50%;top:50%;transform:translate(-50%,-50%)}
.legend{display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--muted)}
.legend i{flex:1;height:8px;border-radius:8px;background:linear-gradient(90deg,var(--heat-lo),var(--heat-mid),var(--heat-hi))}

.sheet-bg{position:fixed;inset:0;background:rgba(5,7,14,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;padding:18px 16px calc(26px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto;background:var(--sheet0);border:1.5px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 4px;flex:none}
.opt{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--line);text-decoration:none;color:inherit;background:transparent;width:100%;text-align:left;border-radius:18px}
.opt .ic{width:36px;height:36px;display:grid;place-items:center;flex:none;font-weight:700;border-radius:12px;border:1.5px solid var(--cy);color:var(--cy)}
.opt b{display:block}.opt small{color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;padding:10px 14px;font-size:.88rem;font-weight:600;max-width:86%;text-align:center;background:#1A2140;color:var(--ink);border-radius:14px;border:1px solid var(--line)}
.copybox{display:flex;gap:8px;align-items:center;padding:10px 12px;border:1px dashed var(--cy);color:var(--cy);border-radius:12px;font-family:var(--num);font-size:.8rem;word-break:break-all}
.banner{margin:0 16px;padding:10px 12px;border:1.5px solid var(--pk);border-radius:14px;font-size:.86rem;color:var(--ink);background:var(--card0)}
.center{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:14px}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--cy);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}.toast{animation:fade .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}@keyframes fade{from{opacity:0}}}
.badge{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-family:var(--num);white-space:nowrap}
.badge.adm{border-color:var(--gr);color:var(--gr)}
.badge.pend{border-color:var(--pk);color:var(--pk)}
.chip.sm{padding:5px 10px;font-size:.78rem}
.av.gone{background:#3A4058!important;color:var(--ink)}
.whorow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.whorow .k{width:96px;flex:none;color:var(--muted);font-size:.86rem}
.card.install{flex-direction:row;gap:12px;align-items:flex-start}
.install img{width:44px;height:44px;border-radius:12px;flex:none}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;line-height:1.45}
.warn{font-size:.85rem;color:var(--muted);border-left:3px solid var(--gr);padding-left:10px}
</style>
</head>
<body>
<div class="app" id="app"><div class="body"><div class="center" style="align-items:center"><div class="spin"></div></div></div></div>
<script>
// ===== Configuración =====
const REPO='arehermann/juntadas';           // repo de GitHub donde la Raspberry anota su dirección
const POLL_MS=15000;                         // cada cuánto se actualiza solo
const COLORS=['#E3B76B','#D99AAE','#8FC4A4','#B3A1DB','#8FB8DE','#E0A383','#C9B37E','#9FC9C9','#C4A0C4','#A9B98A','#DDA0A0','#94A8D6'];

// ===== Utilidades =====
const $app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const t=h=>pad(h%24)+':00';
const dObj=iso=>new Date(iso+'T12:00:00Z');
const isoOf=d=>d.toISOString().slice(0,10);
const addDays=(iso,n)=>{const d=dObj(iso);d.setUTCDate(d.getUTCDate()+n);return isoOf(d)};
const todayIso=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fmtD=(iso,o)=>dObj(iso).toLocaleDateString('es-AR',{timeZone:'UTC',...o}).replace('.','');
const wd=iso=>fmtD(iso,{weekday:'short'});
const dayLbl=iso=>wd(iso)+' '+dObj(iso).getUTCDate();
const dayLong=iso=>dayLbl(iso)+' '+fmtD(iso,{month:'short'});
const money=n=>'$ '+Math.round(n).toLocaleString('es-AR');
const daysOf=e=>{const out=[];let d=e.start;while(d<=e.end&&out.length<32){out.push(d);d=addDays(d,1)}return out};
const hoursOf=e=>{const out=[];for(let h=e.hourFrom;h<e.hourTo;h++)out.push(h);return out};
const key=(d,h)=>d+'T'+pad(h);
function rangeLbl(e){const a=dObj(e.start),b=dObj(e.end);
  if(e.start===e.end)return dayLong(e.start);
  const sameM=a.getUTCMonth()===b.getUTCMonth();
  return 'Del '+dayLbl(e.start)+(sameM?'':' '+fmtD(e.start,{month:'short'}))+' al '+dayLbl(e.end)+' '+fmtD(e.end,{month:'short'})}

const I={
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6"/></svg>',
  hand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5a2 2 0 0 1 4 0v6M13 10V8a2 2 0 0 1 4 0v5a7 7 0 0 1-7 7h-.5A5.5 5.5 0 0 1 5 16.5L4 13a2 2 0 0 1 3.5-1.7L9 13"/></svg>',
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  key:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M14 9l2 2"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>'
};

// ===== Guardado en el celular: tu llave personal y la dirección de la Raspberry =====
const LS='juntadas:v2';
function lsGet(){try{return JSON.parse(localStorage.getItem(LS))||{}}catch{return{}}}
function lsSet(v){try{localStorage.setItem(LS,JSON.stringify(v))}catch{}}
const store=lsGet();
const saveStore=()=>lsSet(store);

// ===== Estado =====
const S={api:null,status:'cargando',me:null,events:[],eid:null,screen:'inicio',mode:'tactil',
  sel:null,sheet:null,toast:null,busy:false,offline:false,invite:null,err:null,
  form:{day:null,from:null,to:null},gOpen:false,gf:null,nf:null,cf:null,arm:null,pay:null};

// ===== Instalar en el celular =====
let installEvt=null;
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const canInstall=()=>!isStandalone()&&(installEvt||isIOS);
window.addEventListener('beforeinstallprompt',e_=>{e_.preventDefault();installEvt=e_;if(S.status==='ok')render()});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('¡Listo! Ya podés abrir Juntadas desde el ícono')});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
function installCard(){if(!canInstall()||store.noInstall)return'';
  return `<div class="card hi install"><img src="icons/icon-192.png" alt=""><div class="grow"><h3>Instalala en tu celular</h3><span class="muted small">Se abre desde un ícono, a pantalla completa, sin buscar el link.</span>
    <div class="row" style="margin-top:8px;gap:14px"><button class="chip" data-act="install">Instalar</button><button class="linkbtn" data-act="noinstall">Ahora no</button></div></div></div>`}

const ev=()=>S.events.find(e=>e.id===S.eid)||null;
const meId=()=>S.me&&S.me.id;
const isAdmin=e=>e&&e.adminId===meId();
function person(e,id){const i=e.members.findIndex(m=>m.id===id);
  if(i>=0)return{...e.members[i],color:COLORS[i%COLORS.length]};
  const f=(e.former||[]).find(m=>m.id===id);return{id,name:f?f.name:'?',color:null,gone:true}}
const nameOf=(e,id)=>id===meId()?'Vos':person(e,id).name;
const av=(e,id)=>{const p=person(e,id);return `<span class="av${p.gone?' gone':''}" ${p.color?`style="background:${p.color}"`:''} title="${esc(p.name)}">${esc((p.name[0]||'?').toUpperCase())}</span>`};
const personalLink=()=>location.origin+location.pathname+'#k='+store.token;
const inviteLink=e=>location.origin+location.pathname+'#i='+e.id+'.'+e.invite;

// ===== Conexión con la Raspberry =====
async function healthy(url){
  try{const c=new AbortController();const tm=setTimeout(()=>c.abort(),7000);
    const r=await fetch(url.replace(/\/$/,'')+'/api/health',{signal:c.signal,cache:'no-store'});clearTimeout(tm);return r.ok}catch{return false}}
async function urlFromGitHub(){
  const tries=[
    ()=>fetch('https://api.github.com/repos/'+REPO+'/contents/backend.json?ref=main',{headers:{Accept:'application/vnd.github.raw+json'},cache:'no-store'}),
    ()=>fetch('https://raw.githubusercontent.com/'+REPO+'/main/backend.json?t='+Date.now(),{cache:'no-store'}),
    ()=>fetch('backend.json?t='+Date.now(),{cache:'no-store'})];
  for(const f of tries){try{const r=await f();if(r.ok){const j=await r.json();if(j&&j.url)return j.url}}catch{}}
  return null}
async function findApi(){
  const q=new URLSearchParams(location.search).get('api');
  if(q){if(await healthy(q))return q.replace(/\/$/,'')}
  if(store.api&&await healthy(store.api))return store.api;
  const u=await urlFromGitHub();
  if(u&&await healthy(u)){store.api=u.replace(/\/$/,'');saveStore();return store.api}
  return null}

class AuthError extends Error{}
async function api(method,path,body){
  if(!S.api)throw new Error('Sin conexión con la Raspberry');
  const headers={};if(body)headers['Content-Type']='application/json';if(store.token)headers.Authorization='Bearer '+store.token;
  let r;
  try{r=await fetch(S.api+'/api'+path,{method,cache:'no-store',headers,body:body?JSON.stringify(body):undefined})}
  catch(err){S.offline=true;reconnect();throw new Error('No hay conexión con la Raspberry. Probá de nuevo en un ratito.')}
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&store.token)throw new AuthError(j.error||'Llave inválida');
  if(!r.ok)throw new Error(j.error||('Error '+r.status));
  S.offline=false;
  if(j.me){S.me=j.me;S.events=j.events||[];pickEvent()}
  return j}

let reconnecting=false;
async function reconnect(){if(reconnecting)return;reconnecting=true;
  const u=await findApi();reconnecting=false;
  if(u){S.api=u;S.offline=false;await refresh(true)}else render()}

function pickEvent(){if(!S.events.find(e=>e.id===S.eid))S.eid=S.events[0]?S.events[0].id:null}
function lostKey(){delete store.token;saveStore();S.me=null;S.events=[];S.status='bienvenida';S.err='Tu llave personal ya no es válida en este celular. Si tenés tu link personal, abrilo; si no, entrá de nuevo con un link de invitación.'}

async function refresh(force){
  if(!S.api||!store.token||document.hidden||S.status!=='ok')return;
  try{const before=JSON.stringify(S.events.map(e=>[e.id,e.updated]));await api('GET','/me');
    if(force||before!==JSON.stringify(S.events.map(e=>[e.id,e.updated]))){if(!busyUi())render()}}
  catch(err){if(err instanceof AuthError){lostKey()}render()}}
const busyUi=()=>dragging||(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName));

// ===== Cálculos =====
function availSets(e){const o={};e.members.forEach(m=>o[m.id]=new Set(e.avail[m.id]||[]));return o}
const respondedIds=e=>e.members.filter(m=>(e.avail[m.id]||[]).length).map(m=>m.id);
function whoCan(e,sets,k){return e.members.filter(m=>sets[m.id].has(k)).map(m=>m.id)}
function best(e){const sets=availSets(e);let b={c:-1};
  daysOf(e).forEach(d=>{const hs=hoursOf(e);let i=0;while(i<hs.length){const c=whoCan(e,sets,key(d,hs[i])).length;let j=i;
    while(j+1<hs.length&&whoCan(e,sets,key(d,hs[j+1])).length===c)j++;
    if(c>b.c||(c===b.c&&j-i>b.e-b.s))b={c,day:d,s:i,e:j,from:hs[i],to:hs[j]+1};i=j+1}});
  return b}
function myRuns(e,mine){const out=[];daysOf(e).forEach(d=>{let st=null;for(let h=e.hourFrom;h<=e.hourTo;h++){const on=h<e.hourTo&&mine.has(key(d,h));
  if(on&&st===null)st=h;if(!on&&st!==null){out.push({day:d,from:st,to:h});st=null}}});return out}
function balances(e){const b={};e.members.forEach(m=>b[m.id]=0);
  e.expenses.forEach(x=>{b[x.payer]=(b[x.payer]||0)+x.amount;const sh=x.amount/x.among.length;x.among.forEach(m=>{b[m]=(b[m]||0)-sh})});return b}
function settle(b){const d=[],c=[];Object.keys(b).forEach(m=>{if(b[m]<-0.5)d.push([m,-b[m]]);else if(b[m]>0.5)c.push([m,b[m]])});
  d.sort((a,z)=>z[1]-a[1]);c.sort((a,z)=>z[1]-a[1]);const out=[];let i=0,j=0;
  while(i<d.length&&j<c.length){const v=Math.min(d[i][1],c[j][1]);out.push([d[i][0],c[j][0],v]);d[i][1]-=v;c[j][1]-=v;if(d[i][1]<0.5)i++;if(c[j][1]<0.5)j++}return out}
const owes=(e,id)=>Math.abs(balances(e)[id]||0)>=0.5;
function contacts(e){const seen=new Map();S.events.forEach(x=>{if(x.id!==e.id)x.members.forEach(m=>{if(m.id!==meId()&&!e.members.some(y=>y.id===m.id))seen.set(m.id,m.name)})});return[...seen].map(([id,name])=>({id,name}))}

function topbar(title,sub,back,right){

function nav(){const tabs=[['inicio','Juntadas',I.home],['dispo','Mi disponibilidad',I.cal],['gastos','Gastos',I.money]];
  const cur=S.screen==='evento'?'inicio':S.screen;

const banner=()=>S.offline?`<div class="banner">No hay conexión con la Raspberry. Puede estar apagada o reiniciándose. Los cambios no se están guardando.</div>`:'';

   :`<div class="card hi"><div class="field"><label for="i-name">Tu nombre</label><input id="i-name" maxlength="30" placeholder="Como te conocen" autocomplete="given-name"></div>

function scrInicio(){
  const evs=S.events.map(e=>{const b=best(e),c=e.confirmed,r=respondedIds(e).length;
    return `<button class="card ${c?'ok':'vote'}" data-act="ev:${e.id}">

      <div class="muted">${c?dayLong(c.date)+' · '+t(c.from)+' a '+t(c.to):rangeLbl(e)+' · respondieron '+r+' de '+e.members.length}${e.place?' · '+esc(e.place):''}</div>
      <div class="row between"><div class="avs">${e.members.map(m=>av(e,m.id)).join('')}</div>${!c&&b.c>0?`<span class="num muted small">Mejor: ${dayLbl(b.day)} · ${t(b.from)}</span>`:isAdmin(e)?'<span class="badge adm">Organizás</span>':''}</div>
    </button>`}).join('');
  return topbar('Hola, '+esc(S.me.name),'¿Cuándo nos vemos?',null,`<button class="iconbtn" data-act="sheet:menu" aria-label="Tu cuenta">${I.menu}</button>`)+banner()+`<div class="body">
  ${installCard()}

  ${evs||`<div class="card"><p class="muted">Todavía no tenés juntadas. Creá una con <b>+ Nueva</b> e invitá a quien quieras con el link. Cada una ve solo las juntadas a las que la invitaron.</p></div>`}
  </div>`+nav()}

function heatBg(c,total){const p=total?c/total:0;return p<=.5?`color-mix(in oklab,var(--heat-mid) ${Math.round(p*200)}%,var(--heat-lo))`:`color-mix(in oklab,var(--heat-hi) ${Math.round((p-.5)*200)}%,var(--heat-mid))`}
function grid(e,kind){const days=daysOf(e),total=e.members.length,sets=availSets(e),mine=sets[meId()]||new Set();
  let s=`<div class="gridwrap"><div class="grid ${kind}" style="--cols:${days.length}"><div class="gh"></div>`+days.map(d=>`<div class="gh">${wd(d)}<b>${dObj(d).getUTCDate()}</b></div>`).join('');
  hoursOf(e).forEach(h=>{s+=`<div class="gt">${h}</div>`;days.forEach(d=>{const k=key(d,h);
    if(kind==='heat'){const c=whoCan(e,sets,k).length;s+=`<button class="c${S.sel===k?' sel':''}${c===total&&total>1?' full':''}" data-act="cell:${k}" style="background:${heatBg(c,total)}" aria-label="${dayLbl(d)}, ${t(h)}: pueden ${c} de ${total}"></button>`}
    else s+=`<div class="c${mine.has(k)?' on':''}" data-cell="${k}" role="checkbox" aria-checked="${mine.has(k)}" aria-label="${dayLbl(d)}, ${t(h)}"></div>`})});
  return s+'</div></div>'}

function scrEvento(){const e=ev();if(!e){S.screen='inicio';return scrInicio()}
  const total=e.members.length,b=best(e),c=e.confirmed,sets=availSets(e),resp=respondedIds(e),pend=e.members.filter(m=>!resp.includes(m.id)).map(m=>m.id),adm=isAdmin(e);
  const admName=nameOf(e,e.adminId);
  let info;
  if(S.sel){const d=S.sel.slice(0,10),h=+S.sel.slice(11);const y=whoCan(e,sets,S.sel),n=resp.filter(m=>!y.includes(m));
    const rowOf=(k,ids,empty)=>`<div class="whorow"><span class="k">${k}</span>${ids.map(id=>av(e,id)).join('')||`<span class="muted small">${empty}</span>`}</div>`;
    info=`<div class="row between"><b>${dayLbl(d)} · ${t(h)} a ${t(h+1)}</b><span class="num">${y.length}/${total}</span></div>
    ${rowOf('Pueden',y,'nadie')}${n.length?rowOf('No pueden',n,''):''}${pend.length?rowOf('Sin responder',pend,''):''}`}
  else info=`<span class="muted">Tocá un cuadrito para ver quién puede, quién no y quién todavía no respondió.</span>`;
  const head=c?`<div class="lbl st-ok">Fecha confirmada</div><div class="big">${dayLong(c.date)} · ${t(c.from)}–${t(c.to)}</div><div class="muted">Agregala a tu calendario.</div>
      <div class="btns"><button class="btn alt" data-act="sheet:cal">${I.cal} Agregar al calendario</button></div>${adm?'<button class="linkbtn" data-act="unconfirm">Volver a votar</button>':''}`
    :b.c>0?`<div class="lbl">Mejor momento</div><div class="big">${dayLbl(b.day)} · ${t(b.from)}–${t(b.to)}</div><div class="muted">Pueden ${b.c} de ${total}${b.c===total&&total>1?', ¡todas!':''}</div>
      ${adm?`<div class="btns"><button class="btn alt" data-act="sheet:confirm">${I.cal} Confirmar fecha</button></div>`:`<div class="muted small">Cuando estén todas, ${esc(admName)} confirma la fecha.</div>`}`
    :`<div class="lbl">Todavía nadie marcó</div><p class="muted">Cargá tu disponibilidad${adm?' e invitá a la gente con el link':''}.</p>`;
  const people=e.members.map(m=>{const id=m.id;return `<div class="li">${av(e,id)}<span class="grow"><b>${esc(nameOf(e,id))}</b></span>
    ${id===e.adminId?'<span class="badge adm">Organiza</span>':''}${!resp.includes(id)?'<span class="badge pend">Sin responder</span>':''}
    ${adm&&id!==e.adminId?`<button class="x" data-act="kick:${id}" aria-label="Sacar de la juntada">${I.x}</button>`:''}</div>`}).join('');
  const kickMsg=S.arm&&S.arm.startsWith('kick:')?`<div class="warn">Tocá de nuevo la ✕ para sacar a ${esc(nameOf(e,S.arm.slice(5)))}.</div>`:'';
  return topbar(esc(e.title),rangeLbl(e)+(e.place?' · '+esc(e.place):''),'inicio')+banner()+`<div class="body">
  <div class="card ${c?'ok':'hi'}">${head}</div>
  <div class="card"><div class="row between"><h3>Disponibilidad</h3><span class="lbl">Respondieron ${resp.length} de ${total}</span></div>
    ${grid(e,'heat')}
    <div class="legend"><span>0</span><i></i><span>${total}</span></div>
    ${pend.length?`<div class="muted small">Falta${pend.length>1?'n':''}: ${pend.map(id=>esc(nameOf(e,id))).join(', ')}. Mientras no respondan, cuentan como que no pueden.</div>`:''}</div>
  <div class="card">${info}</div>
  <div class="btns"><button class="btn" data-act="go:dispo">${I.hand} Cargar lo mío</button><button class="btn ghost" data-act="go:gastos">${I.money} Gastos</button></div>
  <div class="card"><div class="row between"><h3>Quiénes van</h3>${adm?`<button class="chip" data-act="sheet:invite">${'+ Invitar'}</button>`:''}</div><div class="list">${people}</div>${kickMsg}</div>
  ${adm?`<button class="btn danger block" data-act="delev">${S.arm==='delev'?'Tocá de nuevo para borrar la juntada':'Borrar juntada'}</button>`
       :`<button class="btn danger block" data-act="leave">${S.arm==='leave'?'Tocá de nuevo para salir':'Salir de la juntada'}</button>`}
  </div>`+nav()}

function evPicker(){if(S.events.length<2)return'';
  return `<div class="field"><label for="ev-pick">Juntada</label><select id="ev-pick" data-change="pick">${S.events.map(e=>`<option value="${e.id}"${e.id===S.eid?' selected':''}>${esc(e.title)}</option>`).join('')}</select></div>`}
const noEvent=title=>topbar(title)+banner()+`<div class="body"><div class="card"><p class="muted">Primero hace falta una juntada.</p><button class="btn block" data-act="newev">${I.plus} Crear juntada</button></div></div>`+nav();

function scrDispo(){const e=ev();if(!e)return noEvent('Mi disponibilidad');
  const mine=new Set(e.avail[meId()]||[]),r=myRuns(e,mine),days=daysOf(e),hs=hoursOf(e);
  if(!days.includes(S.form.day))S.form={day:days[0],from:Math.max(e.hourFrom,Math.min(15,e.hourTo-1)),to:Math.min(e.hourTo,Math.max(19,e.hourFrom+1))};
  const sel=(id,opts,v)=>`<select id="${id}" data-f="${id}">${opts.map(([val,l])=>`<option value="${val}"${String(val)===String(v)?' selected':''}>${l}</option>`).join('')}</select>`;
  const presets=[['Mañana',10,13],['Tarde',14,19],['Noche',19,24],['Todo el día',e.hourFrom,e.hourTo]].map(([l,a,b])=>[l,Math.max(a,e.hourFrom),Math.min(b,e.hourTo)]).filter(([,a,b])=>a<b);
  const list=r.length?`<div class="list">${r.map(x=>`<div class="li"><span class="grow"><b>${dayLbl(x.day)}</b> <span class="num muted">· ${t(x.from)} a ${t(x.to)}</span></span><button class="x" data-act="delrun:${x.day}|${x.from}|${x.to}" aria-label="Borrar franja">${I.x}</button></div>`).join('')}</div>`:'<span class="muted">Todavía no marcaste horarios.</span>';
  const body=S.mode==='tactil'
   ?`<div class="card"><div class="muted small">Tocá o arrastrá el dedo para marcar cuándo podés. Pasá de nuevo por encima para desmarcar. Se guarda solo.</div>${grid(e,'mine')}</div>`
   :`<div class="card"><h3>Agregar franja</h3>
     <div class="fields"><div class="field"><label for="m-day">Día</label>${sel('m-day',days.map(d=>[d,dayLong(d)]),S.form.day)}</div>
     <div class="field"><label for="m-from">Desde</label>${sel('m-from',hs.map(h=>[h,t(h)]),S.form.from)}</div>
     <div class="field"><label for="m-to">Hasta</label>${sel('m-to',hs.map(h=>[h+1,t(h+1)]),S.form.to)}</div></div>
     <div class="chips">${presets.map(([l,a,b])=>`<button class="chip" data-act="preset:${a}-${b}">${l}</button>`).join('')}</div>
     <button class="btn block" data-act="addrange">${I.plus} Agregar</button></div>`;
  return topbar('Mi disponibilidad',esc(e.title)+' · '+rangeLbl(e))+banner()+`<div class="body">
  ${evPicker()}
  <div class="seg" role="group" aria-label="Forma de carga"><button data-act="mode:tactil" aria-pressed="${S.mode==='tactil'}">${I.hand} Tocar la grilla</button><button data-act="mode:manual" aria-pressed="${S.mode==='manual'}">${I.pen} Escribir horas</button></div>
  ${body}
  <div class="card"><div class="row between"><h3>Tus franjas</h3>${r.length?'<button class="chip" data-act="clear">Borrar todo</button>':''}</div>${list}</div>
  <button class="btn ghost block" data-act="ev:${e.id}">Ver cómo queda el grupo</button>
  </div>`+nav()}

function scrGastos(){const e=ev();if(!e)return noEvent('Gastos');
  const ms=e.members,b=balances(e),tr=settle(b),gastos=e.expenses.filter(x=>x.kind!=='pago'),tot=gastos.reduce((a,x)=>a+x.amount,0),mine=b[meId()]||0,adm=isAdmin(e);
  if(!S.gf||S.gf.eid!==e.id)S.gf={eid:e.id,desc:'',amt:'',payer:meId(),among:new Set(ms.map(m=>m.id))};
  const all=S.gf.among.size===ms.length;
  const form=S.gOpen?`<div class="card hi"><div class="row between"><h3>Nuevo gasto</h3><button class="x" data-act="gclose" aria-label="Cerrar">${I.x}</button></div>
    <div class="field"><label for="g-desc">¿Qué se compró?</label><input id="g-desc" data-g="desc" maxlength="60" value="${esc(S.gf.desc)}" placeholder="Ej: pan y ensalada" autocomplete="off"></div>
    <div class="field"><label for="g-amt">Monto</label><input id="g-amt" data-g="amt" inputmode="decimal" value="${esc(S.gf.amt)}" placeholder="$ 0" autocomplete="off"></div>
    <div class="field"><label>Pagó</label><div class="chips">${ms.map(m=>`<button class="chip" data-act="payer:${m.id}" aria-pressed="${S.gf.payer===m.id}">${esc(nameOf(e,m.id))}</button>`).join('')}</div></div>
    <div class="field"><div class="row between"><label>Se divide entre</label><button class="chip sm" data-act="amongall">${all?'Ninguna':'Todas'}</button></div>
      <div class="chips">${ms.map(m=>`<button class="chip" data-act="among:${m.id}" aria-pressed="${S.gf.among.has(m.id)}">${esc(nameOf(e,m.id))}</button>`).join('')}</div>
      <span class="muted small">${S.gf.among.size?`${money((parseAmt(S.gf.amt)||0)/S.gf.among.size)} cada una`:'Elegí al menos una'}</span></div>
    <button class="btn block" data-act="gsave"${S.busy?' disabled':''}>Guardar gasto</button></div>`
   :`<button class="btn block" data-act="gopen">${I.plus} Agregar gasto</button>`;
  const amongLbl=x=>x.among.length===ms.length&&x.among.every(id=>ms.some(m=>m.id===id))?'todas':x.among.map(id=>esc(nameOf(e,id))).join(', ');
  const canDel=x=>x.by===meId()||adm;
  const payRow=([f,to,v])=>{const k=f+'>'+to,can=f===meId()||to===meId()||adm;
    return `<div class="li">${av(e,f)}<span class="grow"><b>${esc(nameOf(e,f))}</b> <span class="muted">le ${f===meId()?'pasás':'pasa'} a</span> <b>${esc(nameOf(e,to))}</b></span><b class="num">${money(v)}</b>
    ${can?`<button class="chip sm" data-act="pay:${k}:${Math.round(v*100)/100}">${S.pay===k?'¿Ya se pagó? Tocá de nuevo':'Registrar pago'}</button>`:''}</div>`};
  return topbar('Gastos',esc(e.title))+banner()+`<div class="body">
  ${evPicker()}
  <div class="card hi"><div class="row between"><div><div class="lbl">Total</div><div class="big num">${money(tot)}</div></div>
   <div style="text-align:right"><div class="lbl">Tu saldo</div><div class="big num">${mine>=-0.5?'+':'−'}${money(Math.abs(mine)).slice(2)}</div></div></div>
   <div class="muted small">${Math.abs(mine)<0.5?'Estás al día':mine>0?'Te deben '+money(mine):'Debés '+money(-mine)}</div></div>
  ${form}
  <div class="card"><h3>Quién le paga a quién</h3><div class="list">${tr.map(payRow).join('')||'<span class="muted">Están todas al día.</span>'}</div>
    ${tr.length?'<span class="muted small">Cuando alguien paga, tocá "Registrar pago" para que quede saldado. Nadie puede salir de la juntada con cuentas pendientes.</span>':''}</div>
  <div class="card"><h3>Movimientos</h3><div class="list">${e.expenses.slice().reverse().map(x=>x.kind==='pago'
    ?`<div class="li">${av(e,x.payer)}<span class="grow"><b>${esc(nameOf(e,x.payer))}</b> <span class="muted">le pagó a</span> <b>${esc(nameOf(e,x.among[0]))}</b></span><b class="num">${money(x.amount)}</b>${canDel(x)?`<button class="x" data-act="gdel:${x.id}" aria-label="Borrar pago">${I.x}</button>`:''}</div>`
    :`<div class="li">${av(e,x.payer)}<span class="grow"><b>${esc(x.desc)}</b><br><small class="muted">Pagó ${esc(nameOf(e,x.payer))} · entre ${amongLbl(x)}</small></span><b class="num">${money(x.amount)}</b>${canDel(x)?`<button class="x" data-act="gdel:${x.id}" aria-label="Borrar gasto">${I.x}</button>`:''}</div>`).join('')||'<span class="muted">Todavía no hay gastos.</span>'}</div></div>
  </div>`+nav()}

function scrEstado(){

// ===== Calendario =====
function calTimes(e){const c=e.confirmed,d=c.date.replace(/-/g,'');
  const end=c.to===24?addDays(c.date,1).replace(/-/g,'')+'T000000':d+'T'+pad(c.to)+'0000';return{start:d+'T'+pad(c.from)+'0000',end}}
function gcalLink(e){const {start,end}=calTimes(e);const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(e.title)+'&dates='+start+'/'+end+(tz?'&ctz='+encodeURIComponent(tz):'')+(e.place?'&location='+encodeURIComponent(e.place):'')+'&details='+encodeURIComponent('Organizado con Juntadas')}
function outlookLink(e){const c=e.confirmed;const s=c.date+'T'+pad(c.from)+':00:00';const en=(c.to===24?addDays(c.date,1)+'T00':c.date+'T'+pad(c.to))+':00:00';
  return 'https://outlook.live.com/calendar/0/deeplink/compose?path=%2Fcalendar%2Faction%2Fcompose&rru=addevent&subject='+encodeURIComponent(e.title)+'&startdt='+s+'&enddt='+en+(e.place?'&location='+encodeURIComponent(e.place):'')+'&body='+encodeURIComponent('Organizado con Juntadas')}
function icsText(e){const {start,end}=calTimes(e);const ie=s=>String(s).replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Juntadas//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT','UID:'+e.id+'@juntadas','DTSTAMP:'+stamp,'DTSTART:'+start,'DTEND:'+end,'SUMMARY:'+ie(e.title),e.place?'LOCATION:'+ie(e.place):null,'DESCRIPTION:'+ie('Organizado con Juntadas'),'END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n')+'\r\n'}
function downloadIcs(e){const blob=new Blob([icsText(e)],{type:'text/calendar;charset=utf-8'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=(e.title.replace(/[^\w\-áéíóúñü ]+/gi,'').trim()||'juntada')+'.ics';document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}

// ===== Render =====
let lastScreenKey='';
function render(){
  const y=window.scrollY,sk=S.status+S.screen+S.eid;
  let html;
  if(S.status==='bienvenida')html=scrBienvenida();
  else if(S.status==='invitacion')html=scrInvitacion();
  else if(S.status!=='ok')html=scrEstado();
  else html=({inicio:scrInicio,evento:scrEvento,dispo:scrDispo,gastos:scrGastos}[S.screen]||scrInicio)();
  $app.innerHTML=html+(S.status==='ok'?sheet():'')+(S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:'');
  if(sk===lastScreenKey)window.scrollTo(0,y);else window.scrollTo(0,0);
  lastScreenKey=sk;
  const e=ev();document.title=S.status==='ok'&&S.screen!=='inicio'&&e?(e.title+' · Juntadas'):'Juntadas'}
let toastT;function toast(m){S.toast=m;render();clearTimeout(toastT);toastT=setTimeout(()=>{S.toast=null;render()},3200)}
async function run(fn){if(S.busy)return;S.busy=true;try{await fn()}catch(err){S.busy=false;if(err instanceof AuthError){lostKey();render();return}toast(err.message);return}S.busy=false;render()}

// ===== Disponibilidad: guardar =====
let saveT=null,pendingMine=null;
function setMine(e,set){e.avail[meId()]=[...set].sort();pendingMine={eid:e.id,slots:[...set]};clearTimeout(saveT);saveT=setTimeout(flushMine,500)}
async function flushMine(){if(!pendingMine)return;const p=pendingMine;pendingMine=null;
  try{await api('PUT','/events/'+p.eid+'/avail',{slots:p.slots});if(!busyUi())render()}catch(err){toast(err.message)}}

const parseAmt=s=>parseFloat(String(s).replace(/\$|\s/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.'));

// ===== Acciones =====
const val=id=>{const el=document.getElementById(id);return el?el.value.trim():''};
async function copy(text,msg){try{await navigator.clipboard.writeText(text);toast(msg)}catch{toast('Mantené apretado el link para copiarlo')}}
async function act(a){const[k,...rest]=a.split(':');const v=rest.join(':');
  const armed=S.arm;if(!['delev','leave','kick','resetinv'].includes(k))S.arm=null;
  if(k!=='pay')S.pay=null;
  const e=ev();
  switch(k){
  case'go':S.screen=v;S.sheet=null;S.sel=null;if(v==='gastos')S.gOpen=false;break;
  case'ev':S.eid=v;S.screen='evento';S.sel=null;history.replaceState(null,'','#e='+v);break;
  case'sheet':S.sheet=v;
    if(v==='confirm'){const b=best(e);let f={date:b.day,from:b.from,to:b.to};
      if(S.sel){const d=S.sel.slice(0,10),h=+S.sel.slice(11),sets=availSets(e),c=whoCan(e,sets,S.sel).length;let to=h+1;while(to<e.hourTo&&whoCan(e,sets,key(d,to)).length===c)to++;f={date:d,from:h,to}}
      S.cf=f}break;
  case'close':S.sheet=null;break;
  case'cell':S.sel=S.sel===v?null:v;break;
  case'mode':S.mode=v;break;
  case'retry':return boot();
  case'install':if(installEvt){const ie=installEvt;installEvt=null;S.sheet=null;render();ie.prompt();try{const c=await ie.userChoice;if(c.outcome!=='accepted')toast('Podés instalarla después desde el menú ☰')}catch{}return}
    if(isIOS){S.sheet='ios';break}return;
  case'noinstall':store.noInstall=true;saveStore();break;
  case'pastekey':{const m=val('w-link').match(/#k=([A-Za-z0-9]+)/)||val('w-link').match(/^([A-Za-z0-9]{32})$/);
    if(!m){toast('Ese no parece tu link personal. Tiene que terminar en #k= y un código.');return}
    location.hash='k='+m[1];return}
  case'start':return run(async()=>{const n=val('w-name');if(!n)throw new Error('Escribí tu nombre');
    const j=await api('POST','/me',{name:n});store.token=j.token;saveStore();S.err=null;S.status='ok';S.screen='inicio';S.sheet='welcome'});
  case'accept':return run(async()=>{const inv=S.invite;let first=false;
    if(!store.token){const n=val('i-name');if(!n)throw new Error('Escribí tu nombre');const j=await api('POST','/me',{name:n});store.token=j.token;saveStore();first=true}
    const j=await api('POST','/join',{eventId:inv.id,code:inv.code});S.invite=null;S.status='ok';S.eid=j.eventId;S.screen='evento';
    history.replaceState(null,'','#e='+j.eventId);if(first)S.sheet='welcome'});
  case'noinvite':S.invite=null;history.replaceState(null,'',location.pathname+location.search);S.status=store.token?'ok':'bienvenida';S.screen='inicio';break;
  case'rename':return run(async()=>{const n=val('me-name');if(!n)throw new Error('Escribí tu nombre');await api('PATCH','/me',{name:n});S.sheet=null;toast('Nombre guardado')});
  case'newev':{const st=todayIso();S.nf={title:'',place:'',start:st,end:addDays(st,6),hourFrom:10,hourTo:24};S.sheet='newev';if(S.screen==='evento')S.screen='inicio';break}
  case'createev':return run(async()=>{const f=S.nf;if(!f.title.trim())throw new Error('Poné un nombre para la juntada');
    if(!f.start||!f.end)throw new Error('Elegí los días');if(+f.hourFrom>=+f.hourTo)throw new Error('El horario "hasta" tiene que ser después del "desde"');
    const j=await api('POST','/events',{...f,hourFrom:+f.hourFrom,hourTo:+f.hourTo});
    S.eid=j.eventId;S.screen='evento';S.sheet='invite';history.replaceState(null,'','#e='+j.eventId)});
  case'doconfirm':return run(async()=>{const f=S.cf;if(+f.from>=+f.to)throw new Error('El horario "hasta" tiene que ser después del "desde"');
    await api('PATCH','/events/'+S.eid,{confirmed:{date:f.date,from:+f.from,to:+f.to}});S.sheet='cal';S.sel=null});
  case'unconfirm':return run(()=>api('PATCH','/events/'+S.eid,{confirmed:null}));
  case'delev':if(armed!=='delev'){S.arm='delev';break}S.arm=null;
    return run(async()=>{await api('DELETE','/events/'+S.eid);S.screen='inicio';toast('Juntada borrada')});
  case'leave':if(armed!=='leave'){S.arm='leave';break}S.arm=null;
    return run(async()=>{await api('DELETE','/events/'+S.eid+'/members/'+meId());S.screen='inicio';toast('Saliste de la juntada')});
  case'kick':if(armed!=='kick:'+v){S.arm='kick:'+v;break}S.arm=null;
    return run(async()=>{const n=nameOf(e,v);await api('DELETE','/events/'+S.eid+'/members/'+v);toast(n+' ya no está en la juntada')});
  case'addc':return run(async()=>{await api('POST','/events/'+S.eid+'/members',{personId:v});toast('Sumada')});
  case'resetinv':if(armed!=='resetinv'){S.arm='resetinv';break}S.arm=null;
    return run(async()=>{await api('POST','/events/'+S.eid+'/invite',{});toast('Link nuevo listo')});
  case'ics':downloadIcs(e);return;
  case'copy':return copy(v==='personal'?personalLink():inviteLink(e),'Link copiado');
  case'share':try{await navigator.share({title:'Juntadas',text:'Te invito a "'+e.title+'"',url:inviteLink(e)})}catch{}return;
  case'preset':{const[a,b]=v.split('-');S.form.from=+a;S.form.to=+b;break}
  case'addrange':{const f=S.form;if(+f.to<=+f.from){toast('El "hasta" tiene que ser después del "desde"');return}
    const m=new Set(e.avail[meId()]||[]);for(let h=+f.from;h<+f.to;h++)m.add(key(f.day,h));setMine(e,m);toast('Franja agregada');return}
  case'delrun':{const[d,a,b]=v.split('|');const m=new Set(e.avail[meId()]||[]);for(let h=+a;h<+b;h++)m.delete(key(d,h));setMine(e,m);break}
  case'clear':setMine(e,new Set());break;
  case'gopen':S.gOpen=true;S.gf=null;break;
  case'gclose':S.gOpen=false;break;
  case'payer':S.gf.payer=v;break;
  case'among':S.gf.among.has(v)?S.gf.among.delete(v):S.gf.among.add(v);break;
  case'amongall':S.gf.among=S.gf.among.size===e.members.length?new Set():new Set(e.members.map(m=>m.id));break;
  case'gsave':return run(async()=>{const g=S.gf,amt=parseAmt(g.amt);
    if(!g.desc.trim())throw new Error('Escribí qué se compró');if(!(amt>0))throw new Error('Poné un monto válido');if(!g.among.size)throw new Error('Elegí entre quiénes se divide');
    await api('POST','/events/'+S.eid+'/expenses',{desc:g.desc,amount:amt,payer:g.payer,among:[...g.among]});S.gOpen=false;S.gf=null;toast('Gasto guardado')});
  case'pay':{const[pair,amt]=[v.slice(0,v.lastIndexOf(':')),+v.slice(v.lastIndexOf(':')+1)];if(S.pay!==pair){S.pay=pair;break}S.pay=null;const[f,to]=pair.split('>');
    return run(async()=>{await api('POST','/events/'+S.eid+'/expenses',{kind:'pago',amount:amt,payer:f,among:[to]});toast('Pago registrado')})}
  case'gdel':return run(()=>api('DELETE','/events/'+S.eid+'/expenses/'+v));
  }
  render()}

$app.addEventListener('click',ev_=>{const el=ev_.target.closest('[data-act],[data-stop]');if(!el)return;
  if(!el.hasAttribute('data-act'))return;

$app.addEventListener('input',e_=>{const el=e_.target;
  if(el.dataset.g&&S.gf){S.gf[el.dataset.g]=el.value;if(el.dataset.g==='amt'){const sm=el.closest('.card').querySelector('.field:last-of-type .muted.small');if(sm&&S.gf.among.size)sm.textContent=money((parseAmt(el.value)||0)/S.gf.among.size)+' cada una'}}

let dragging=false,paint=true,dragSet=null;
function paintCell(c){if(!c||!c.dataset.cell)return;const k=c.dataset.cell;if(paint)dragSet.add(k);else dragSet.delete(k);c.classList.toggle('on',paint);c.setAttribute('aria-checked',paint)}

  const e=ev();dragSet=new Set(e.avail[meId()]||[]);dragging=true;paint=!dragSet.has(c.dataset.cell);paintCell(c)});
$app.addEventListener('pointermove',e_=>{if(!dragging)return;const c=document.elementFromPoint(e_.clientX,e_.clientY);if(c&&c.closest)paintCell(c.closest('.grid.mine .c'))});

// ===== Arranque =====
async function boot(){
  S.status='cargando';S.sheet=null;render();
  if(!S.api)S.api=await findApi();
  if(!S.api){S.status='sinapi';render();return}
  const hash=location.hash;
  let mk=hash.match(/^#k=([A-Za-z0-9]+)/);
  if(mk){const prev=store.token;store.token=mk[1];
    history.replaceState(null,'',location.pathname+location.search);
    try{await api('GET','/me');saveStore();S.status='ok';S.screen='inicio';render();toast('Entraste como '+S.me.name);return}
    catch(err){if(prev)store.token=prev;else delete store.token;saveStore();S.err=err instanceof AuthError?'Ese link personal no es válido.':err.message}}
  if(store.token){try{await api('GET','/me')}catch(err){if(err instanceof AuthError)lostKey();else{S.status='error';S.err=err.message;render();return}}}
  const mi=hash.match(/^#i=([A-Za-z0-9]+)\.([A-Za-z0-9]+)/);
  if(mi){try{const j=await api('GET','/invite/'+mi[1]+'/'+mi[2]);
      if(j.event.already){S.eid=j.event.id;S.screen='evento';S.status='ok';history.replaceState(null,'','#e='+j.event.id);render();return}
      S.invite={...j.event,code:mi[2]};S.status='invitacion';render();return}
    catch(err){S.err=err.message;history.replaceState(null,'',location.pathname+location.search)}}
  if(!store.token||!S.me){S.status='bienvenida';render();return}
  const me_=hash.match(/^#e=([A-Za-z0-9]+)/);
  if(me_&&S.events.some(e=>e.id===me_[1])){S.eid=me_[1];S.screen='evento'}else S.screen='inicio';
  S.status='ok';render();if(S.err){toast(S.err);S.err=null}}
boot();
</script>
</body>
</html>
